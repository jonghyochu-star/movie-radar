name: Movie Radar Gemini Route Check

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: '비교할 공개 YouTube 영상 (기존과 동일한 영상 사용)'
        type: string
        required: true
        default: 'https://www.youtube.com/watch?v=gSu2ghFxoiY'
      confirm_live_call:
        description: '체크하면 generateContent 실제 요청 1회. 미체크는 오프라인 준비만.'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: movie-radar-gemini-route-check
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Read project files
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Test route check offline (no Gemini requests)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -p 'test_gemini_route_check.py' -v
      - name: Prepare or send exactly one request
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_URL: ${{ inputs.youtube_url }}
          CONFIRM_LIVE: ${{ inputs.confirm_live_call }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          args=()
          if [ "$CONFIRM_LIVE" = "true" ]; then
            args+=(--live)
          fi
          python scripts/gemini_route_check.py \
            --youtube-url "$YOUTUBE_URL" \
            --out gemini-route-check-output \
            "${args[@]}"
      - name: Save result or failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-route-check-${{ github.run_number }}-${{ github.run_attempt }}
          path: gemini-route-check-output
          retention-days: 14
          if-no-files-found: warn
