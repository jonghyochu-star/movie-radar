name: Movie Radar Gemini Text Health

on:
  workflow_dispatch:
    inputs:
      confirm_live_call:
        description: '체크하면 Gemini 3.8 Flash에 텍스트 요청을 정확히 1회 보냅니다.'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: movie-radar-gemini-text-health
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read project files
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Syntax check only
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m py_compile scripts/gemini_text_health.py

      - name: Prepare or send one text-only request
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CONFIRM_LIVE: ${{ inputs.confirm_live_call }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          args=()
          if [ "$CONFIRM_LIVE" = "true" ]; then
            args+=(--live)
          fi
          python scripts/gemini_text_health.py \
            --out gemini-text-health-output \
            "${args[@]}"

      - name: Save result or failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-text-health-${{ github.run_number }}-${{ github.run_attempt }}
          path: gemini-text-health-output
          retention-days: 14
          if-no-files-found: warn
