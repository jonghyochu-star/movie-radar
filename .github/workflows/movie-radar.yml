name: Movie Radar

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'demo = 샘플 화면 / live = YouTube 실제 수집'
        type: choice
        required: true
        default: demo
        options:
          - demo
          - live
  schedule:
    # UTC 22:23 = 한국 시간 다음 날 07:23.
    # AUTO_COLLECT=true 변수를 설정해야 실제 실행됩니다.
    - cron: '23 22 * * *'

permissions:
  contents: read

concurrency:
  group: movie-radar-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'schedule' || vars.AUTO_COLLECT == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read project files
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Test collector and settings
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build demo or collect YouTube data
        env:
          RUN_MODE: ${{ github.event_name == 'schedule' && 'live' || inputs.mode }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/collect.py --mode "$RUN_MODE"
      - name: Upload website files only
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 1

  deploy:
    if: needs.build.result == 'success'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish Movie Radar
        id: deployment
        uses: actions/deploy-pages@v4
